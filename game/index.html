<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="data:," />
        <title>Distant Worlds: Universe</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                height: 100%;
                overflow: hidden;
                background: #000;
            }
            /* Dark defaults for every form control, list box, option and scroll bar the game does not style itself
               (Chromium's light defaults drew white boxes behind text, notably on Linux). */
            html {
                color-scheme: dark;
            }
            /* Game text is not page text: a double-click (opening a detail screen) or a drag must not paint the
               browser's white / blue selection behind it. Inputs and the few copyable texts opt back in. */
            body {
                -webkit-user-select: none;
                user-select: none;
            }
            input,
            textarea,
            [contenteditable='true'] {
                -webkit-user-select: text;
                user-select: text;
            }
            ::selection {
                background: rgba(70, 110, 180, 0.55);
                color: inherit;
            }
            canvas {
                display: block;
            }
            /* Game art is never a draggable web image (the main menu background, chrome buttons, portraits). */
            img {
                -webkit-user-drag: none;
                user-select: none;
            }
        </style>
        <script>
            // No part of the game uses HTML drag and drop: stop the browser's own image / selection drag everywhere.
            document.addEventListener('dragstart', (e) => e.preventDefault(), true);
        </script>
    </head>
    <body>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
